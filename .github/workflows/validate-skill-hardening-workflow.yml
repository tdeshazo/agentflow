name: Validate skill hardening workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate workflow
        run: go run . validate -f examples/harden-agentflow-spec-skill.agent-workflow.yaml
      - name: Expand workflow plan
        run: go run . plan --expanded -f examples/harden-agentflow-spec-skill.agent-workflow.yaml
