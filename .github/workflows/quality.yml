name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run canonical AgentFlow gate
        run: ./scripts/check.sh
      - name: Exercise deterministic self-hosting runtime
        run: go test ./internal/engine -run '^TestSelfHosting' -count=1
      - name: Validate self-hosting definition
        run: go run ./cmd/agentflow validate -f examples/develop-agentflow.agent-workflow.yaml
