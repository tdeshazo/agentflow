apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: expose-codex-terminal-styling
  description: >-
    Self-hosting workflow to expose more of Codex CLI's native terminal styling
    while giving AgentFlow a richer semantic orchestration presentation layer.
    Rich terminal output is destination-aware; pipes, detached capture, logs,
    JSON, YAML, and other machine-facing streams remain stable and plain.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    workflow_file: examples/expose-codex-terminal-styling.agent-workflow.yaml
    runtime_reference: docs/reference/runtime.md
    spec_reference: docs/reference/agentflow-v1alpha1.md

  state:
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
    cleanliness:
      before_first_run: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      allowed:
        - '*.go'
        - internal/clioutput/**
        - internal/engine/**
        - internal/gitstate/**
        - internal/observability/**
        - internal/workflow/**
        - provider/**
        - spec/agent-workflow-v1alpha1.yaml
        - docs/reference/runtime.md
        - docs/reference/agentflow-v1alpha1.md
        - README.md
        - CHANGELOG.md
        - go.mod
        - go.sum
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: roadmap
          paths: [ROADMAP.md]
          mode: exact-hash
        - id: research-documents
          paths: [docs/research/**]
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths: [scripts/check.sh]
          mode: exact-hash
        - id: ci-policy
          paths: [.github/workflows/quality.yml]
          mode: exact-hash
        - id: workflow-definition
          paths: [examples/expose-codex-terminal-styling.agent-workflow.yaml]
          mode: exact-hash

  defaults:
    agent:
      runner: codex
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: auto
      may_commit: true
      output_last_message: true
    lifecycle:
      policy: safe-resume
      validation: implementation-gate
    phases:
      implementation:
        actor: luna
        reasoning: high
        requiresChange: true
        validation: implementation-gate
      audit:
        actor: terra
        reasoning: high
        requiresChange: false
        validation: audit-gate
    repair:
      actor: terra
      reasoning: high
      prompt: |
        A deterministic verification step failed while implementing richer Codex
        and AgentFlow terminal presentation.

        Inspect the current checkout and repair only the failure needed for this
        bounded terminal-output task. Preserve workflow semantics, mutation
        authority, structured-output stability, detached/log capture behavior,
        and the protected resources.

        Verification for this workflow intentionally excludes
        `examples/finish-priority-05.agent-workflow.yaml`. Do not run, execute,
        or validate that workflow as part of repair or verification, and do not
        substitute `scripts/check.sh`, because the canonical gate currently
        validates every shipped workflow including that excluded file.

        Required invariants:
        - attached human TTYs may receive rich AgentFlow presentation and native
          Codex color/styling;
        - detached provider capture, logs, pipes, redirection, JSON, and YAML stay
          plain and free of presentation escapes;
        - AgentFlow never parses or recolors Codex's textual output;
        - the provider boundary remains provider-neutral and preserves v1alpha1
          compatibility for existing agent color declarations;
        - `NO_COLOR` removes AgentFlow ANSI styling without changing text or
          execution semantics;
        - terminal capability detection degrades safely when information is
          unavailable;
        - semantic presentation does not affect workflow acceptance authority;
        - tests use deterministic seams rather than requiring a real PTY.

        --- gate output ---
        {{ tail(validation.failure.log, 260) }}

  agents:
    luna:
      model: "{{ parameters.luna_model }}"
    terra:
      model: "{{ parameters.terra_model }}"

  tools:
    format-check:
      type: shell
      command: >-
        bash -lc 'set -euo pipefail; mapfile -t files < <(rg --files -g "*.go" -g "!vendor"); if ((${#files[@]} > 0)); then unformatted="$(gofmt -l "${files[@]}")"; if [[ -n "$unformatted" ]]; then printf "unformatted Go files:\n%s\n" "$unformatted" >&2; exit 1; fi; fi'
    diff-hygiene:
      type: shell
      command: git diff --check && git diff --cached --check
    focused-go-tests:
      type: shell
      command: >-
        go test . ./internal/clioutput ./internal/engine ./internal/observability ./internal/workflow ./provider/...
    focused-go-vet:
      type: shell
      command: >-
        go vet . ./internal/clioutput ./internal/engine ./internal/observability ./internal/workflow ./provider/...
    focused-race-tests:
      type: shell
      command: >-
        go test -race . ./internal/clioutput ./internal/engine ./internal/observability ./provider/...
    workflow-validation-with-priority5-excluded:
      type: shell
      command: >-
        bash -lc 'set -euo pipefail; while IFS= read -r workflow; do if [[ "$workflow" == "examples/finish-priority-05.agent-workflow.yaml" ]]; then printf -- "-- intentionally skipping %s --\n" "$workflow"; continue; fi; printf -- "-- validating %s --\n" "$workflow"; go run . validate -f "$workflow"; done < <(rg --files spec examples -g "*.yaml" -g "*.yml" | sort)'

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg]
    - id: required-files
      type: files-exist
      paths:
        - main.go
        - internal/clioutput/presenter.go
        - internal/engine/runtime_phase.go
        - internal/engine/runtime_human.go
        - internal/engine/status.go
        - internal/observability/output.go
        - provider/provider.go
        - provider/codex/codex.go
        - "{{ spec.paths.runtime_reference }}"
        - "{{ spec.paths.spec_reference }}"
        - "{{ spec.paths.workflow_file }}"

  validation:
    implementation-gate:
      steps:
        - uses: format-check
        - uses: diff-hygiene
        - uses: focused-go-tests
        - uses: focused-go-vet
        - uses: workflow-validation-with-priority5-excluded
      repair: once
    audit-gate:
      steps:
        - uses: format-check
        - uses: diff-hygiene
        - uses: focused-go-tests
        - uses: focused-go-vet
        - uses: focused-race-tests
        - uses: workflow-validation-with-priority5-excluded
    final-gate:
      steps:
        - uses: format-check
        - uses: diff-hygiene
        - uses: focused-go-tests
        - uses: focused-go-vet
        - uses: focused-race-tests
        - uses: workflow-validation-with-priority5-excluded

  phases:
    - id: implement-provider-presentation-boundary
      kind: implementation
      label: make-codex-presentation-destination-aware
      prompt: |
        Improve the provider/output boundary so attached terminal runs can expose
        more native Codex CLI styling without contaminating captured or
        machine-facing output.

        Inspect `provider/provider.go`, `provider/codex/codex.go`, engine provider
        invocation, detached output capture, workflow agent normalization, and
        their tests before changing anything.

        Required behavior:

        1. Native Codex styling
           - When a Codex provider is directly attached to a human terminal,
             allow Codex to use its own color policy rather than forcing plain
             output.
           - Prefer Codex's native `--color auto` semantics for attached runs.
           - Never parse, restyle, strip, or reconstruct Codex's ordinary text
             stream in AgentFlow.

        2. Raw/captured boundaries
           - Detached child output and provider output captured into durable logs
             must remain plain and free of terminal presentation escapes.
           - Pipes and redirection must not gain ANSI merely because the workflow
             agent declaration requests color.
           - Preserve raw stdout/stderr ordering and diagnostic behavior.

        3. Provider-neutral intent
           - Introduce a provider-neutral presentation intent only if it makes the
             boundary clearer; keep the public provider request independent of
             Codex-specific option names.
           - Preserve v1alpha1 compatibility for existing `spec.agents[].color`
             values and defaults. Existing workflows must continue to load and
             normalize deterministically.
           - Map the resolved presentation intent to Codex's supported
             `--color always|never|auto` behavior in the Codex adapter.

        4. Tests
           - Add deterministic tests for attached/TTY, redirected/non-TTY, and
             detached/captured paths without requiring a real PTY.
           - Assert that AgentFlow never inserts its own ANSI into provider
             stdout/stderr.

        Do not run or validate
        `examples/finish-priority-05.agent-workflow.yaml` while verifying this
        phase. Do not use `scripts/check.sh` for this workflow's gate.

    - id: implement-semantic-terminal-renderer
      kind: implementation
      label: add-rich-plain-raw-semantic-rendering
      prompt: |
        Evolve `internal/clioutput` from a role-to-ANSI helper into a small
        semantic renderer for AgentFlow orchestration output.

        Required behavior:

        1. Explicit presentation modes
           - Model at least Rich, Plain, and Raw presentation semantics.
           - Rich is only for interactive human terminal presentation.
           - Plain preserves stable human-readable bytes without styling.
           - Raw is used for streams AgentFlow must not decorate, including
             provider output, logs, JSON, YAML, and detached capture.
           - Keep `NO_COLOR` behavior deterministic: it removes AgentFlow ANSI
             while preserving text and interactivity.

        2. Semantic orchestration primitives
           - Add reusable primitives for phase start/skip/resume, provider
             identity, validation success/failure/reuse, repair attempts,
             checkpoint/completion summaries, notices, key/value metadata, and
             separators/rules.
           - Callers should provide meaning, not hard-code arrows, colors, or
             spacing themselves.
           - Preserve exact historical plain text where compatibility tests or
             machine-adjacent human output rely on it unless a deliberately
             documented text change is necessary.

        3. Runtime migration
           - Replace hand-written `==>` lifecycle presentation in the phase,
             recovery, validation, completion, status, and human-gate paths with
             semantic renderer calls where appropriate.
           - Keep workflow state derivation, acceptance, repair budgets,
             checkpointing, and durable evidence completely unchanged.

        4. Tests
           - Cover Rich/Plain/Raw rendering with ordinary buffers and injected
             terminal capability values.
           - Verify raw boundaries contain no AgentFlow ANSI or decorative
             framing.

        Do not run or validate
        `examples/finish-priority-05.agent-workflow.yaml` while verifying this
        phase. Do not use `scripts/check.sh` for this workflow's gate.

    - id: implement-terminal-capabilities-and-hierarchy
      kind: implementation
      label: add-codex-like-terminal-capabilities-and-hierarchy
      prompt: |
        Add the bounded terminal capabilities needed for a more Codex-like
        AgentFlow presentation without turning AgentFlow into a full-screen TUI.

        Required behavior:

        1. Terminal profile
           - Centralize terminal characteristics used by presentation, including
             TTY/interactivity, color availability or level, width when safely
             discoverable, Unicode suitability, and hyperlink capability when
             safely discoverable.
           - Unknown capabilities must fall back to conservative plain behavior.
           - Avoid mandatory OSC probing or terminal I/O that can hang automated
             runs. Any richer detection must be bounded and optional.

        2. Visual hierarchy
           - In Rich mode, use restrained status glyphs with ASCII fallback,
             subdued metadata, low-contrast separators, and consistent
             indentation so phases, providers, validation, repair, and
             completion are visually distinct.
           - Prefer terminal-native/default colors and modest emphasis over a
             large hard-coded palette.
           - Light/dark or color-depth adaptation may be added when it can be
             detected safely; otherwise retain current portable ANSI behavior.

        3. Hyperlinks and Git summaries
           - Add OSC-8 hyperlinks for repository paths or commits only when the
             terminal profile says hyperlinks are safe; visible text must remain
             useful without hyperlink support.
           - Add a compact post-actor or completion Git change summary when it
             can be derived deterministically from repository state. Keep it
             orchestration-owned; do not parse Codex's diff text.
           - Do not emit full diffs by default and do not introduce an alternate
             screen, full-screen event loop, or scrolling TUI.

        4. Structured/raw boundaries
           - JSON and expanded-plan YAML remain valid and ANSI-free.
           - `logs`, `--tail`, `--follow`, detached capture, and provider streams
             remain raw.
           - Rich presentation must never be persisted as workflow evidence or
             used to decide advancement.

        Add focused tests for capability fallbacks, glyph/ASCII fallback,
        hyperlink enable/disable behavior, and compact Git summary rendering.

        Do not run or validate
        `examples/finish-priority-05.agent-workflow.yaml` while verifying this
        phase. Do not use `scripts/check.sh` for this workflow's gate.

    - id: audit-codex-terminal-styling
      kind: audit
      label: independently-audit-codex-terminal-styling
      validation: audit-gate
      prompt: |
        Independently audit the final checkout for the richer Codex/AgentFlow
        terminal presentation task. Inspect the actual diff from the saved base
        through HEAD; do not accept implementation-phase claims as evidence.

        Verify all of the following:
        - attached terminal runs can expose native Codex styling;
        - detached/captured provider output, logs, pipes, and redirection stay
          plain and stable;
        - AgentFlow does not parse or recolor Codex text;
        - Rich, Plain, and Raw boundaries are explicit and deterministic;
        - lifecycle presentation uses semantic renderer primitives rather than
          scattered hard-coded `==>` formatting;
        - `NO_COLOR` removes AgentFlow ANSI without changing semantics;
        - terminal capability detection falls back conservatively and cannot
          hang automation;
        - Unicode glyphs, separators, hyperlinks, and compact Git summaries have
          useful fallbacks;
        - JSON and YAML remain valid and ANSI-free;
        - workflow acceptance, durability, repair budgets, state projection,
          human evidence, and mutation authority are unchanged;
        - tests exercise TTY/non-TTY, rich/plain/raw, detached capture, provider
          color mapping, capability fallback, and structured-output boundaries
          without requiring a live PTY;
        - provider/workflow compatibility remains intact for existing v1alpha1
          `color` declarations;
        - no protected or unrelated file changed.

        Verification for this audit intentionally excludes
        `examples/finish-priority-05.agent-workflow.yaml`. Do not execute it,
        validate it, or add it to the audit test matrix. Do not invoke
        `scripts/check.sh`, because it currently validates that excluded file.

        Run only the deterministic validations declared by this workflow. Repair
        a genuine in-scope defect if needed; otherwise leave the checkout
        unchanged.

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "Codex terminal styling work already completed at {{ state.workflow_complete.value }}"
        - stop: success
    - phase: implement-provider-presentation-boundary
    - phase: implement-semantic-terminal-renderer
    - phase: implement-terminal-capabilities-and-hierarchy
    - phase: audit-codex-terminal-styling
    - id: post-audit
      validate: audit-gate
    - human: terminal-presentation-review
    - complete: codex-terminal-styling

  humanGates:
    - id: terminal-presentation-review
      requires: [audit-codex-terminal-styling]
      after:
        - validation: post-audit
      instructions: >-
        Review AgentFlow in a real terminal and through redirection. Confirm that
        orchestration output has a clear Codex-like hierarchy, attached Codex
        output retains its native styling, NO_COLOR and non-TTY output remain
        clean, and raw/structured streams are unaffected. This manual review does
        not require running or validating examples/finish-priority-05.agent-workflow.yaml.
      checklist:
        - id: attached-rich-output
          text: "Attached terminal output shows clear AgentFlow hierarchy and native Codex styling."
        - id: raw-streams-clean
          text: "Detached logs, provider capture, pipes, JSON, YAML, and log commands remain plain and stable."
        - id: fallback-readable
          text: "NO_COLOR, ASCII/capability fallback, and terminals without hyperlink support remain readable."
        - id: semantics-unchanged
          text: "Presentation changes do not alter workflow acceptance or durable state semantics."
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        value: head_commit

  completion:
    codex-terminal-styling:
      assertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      afterCheckpointAssertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        value: head_commit
      summary:
        title: "Codex-aware terminal presentation complete."
        include:
          - branch
          - base_commit
          - head_commit
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
