apiVersion: agentflow.dev/v1alpha3
kind: AgentWorkflow
metadata:
  name: agentflow-self-hosting

spec:
  parameters:
    require_human_verification:
      type: boolean
      default: true
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
  workspace:
    allowWrites: [internal/**, cmd/**/*_test.go, README.md, docs/guides/**, docs/planning/**]
    integrity:
      - id: repository-instructions
        mode: exact-hash
        paths: [CONTRIBUTING.md, GO_STYLE_GUIDE.md, CODE_REVIEW.md]
      - id: self-hosting-workflow
        mode: exact-hash
        paths: [examples/representative/agentflow-self-hosting.agent-workflow.yaml]
      - id: agentflow-authoring-contract
        mode: exact-hash
        paths: [skills/agentflow-spec/SKILL.md]
      - id: canonical-quality-gate
        mode: exact-hash
        paths: [scripts/check.sh, .github/workflows/quality.yml]
      - id: canonical-roadmap
        mode: exact-hash
        paths: [ROADMAP.md]
      - id: planning-guidance
        mode: exact-hash
        paths: [docs/planning/README.md]
    initialization:
      requireCleanWorkspace: true
      requireNamedBranch: true
      requireBaseAncestor: true
      requireSameBranch: true
  tools:
    scope:
      type: workspace-policy
      policy: spec.workspace.mutationPolicy
    test:
      type: shell
      command: sh scripts/check.sh
  preconditions:
    - id: git-repository
      type: git-repository
      scope: initialization
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh]
    - id: required-files
      type: files-exist
      paths:
        - CONTRIBUTING.md
        - GO_STYLE_GUIDE.md
        - CODE_REVIEW.md
        - examples/representative/agentflow-self-hosting.agent-workflow.yaml
        - skills/agentflow-spec/SKILL.md
        - ROADMAP.md
        - docs/planning/README.md
        - scripts/check.sh
        - .github/workflows/quality.yml
    - id: quality-workflow-delegates-to-canonical-gate
      type: file-contains
      path: .github/workflows/quality.yml
      text: scripts/check.sh
  agents:
    implementer:
      runner: codex
      model: "{{ parameters.terra_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      may_commit: true
      output_last_message: true
    reviewer:
      runner: codex
      model: "{{ parameters.luna_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      may_commit: false
      output_last_message: true
  validation:
    phase-quality:
      steps: [{uses: scope}, {uses: test}]
      dependencies: ["**"]
      repair: {once: implementer}
      produces: [implementation-accepted]
    final-quality:
      steps: [{uses: scope}, {uses: test}]
      dependencies: ["**"]
      hard: true
      produces: [audit-accepted]
  artifacts:
    implementation-surface:
      type: files
      paths: [internal/**, cmd/**/*_test.go, README.md, docs/guides/**, docs/planning/**]
      persistence: workspace
  evidence:
    implementation-accepted: {type: validation}
    audit-accepted: {type: validation}
  phases:
    - id: implement-agentflow-change
      kind: implementation
      actor: implementer
      prompt: Implement one bounded AgentFlow specification or interpreter change with focused tests and documentation.
      reasoning: high
      requiresChange: true
      validation: phase-quality
      outputs: [implementation-surface]
    - id: integrated-regression-audit
      kind: audit
      actor: reviewer
      dependsOn: [implement-agentflow-change]
      inputs: [{artifact: implementation-surface}, {evidence: implementation-accepted}]
      ifEvidence: implementation-accepted
      readOnly: true
      prompt: Independently audit the accepted AgentFlow change for authority, migration, and regression risks.
      reasoning: high
      requiresChange: false
      validation: final-quality
    - id: final-implementation-audit
      kind: audit
      actor: reviewer
      dependsOn: [integrated-regression-audit]
      inputs: [{evidence: audit-accepted}]
      ifEvidence: audit-accepted
      readOnly: true
      prompt: Perform a final cross-cutting audit of implementation and tests; report only verified defects without editing the workspace.
      reasoning: high
      requiresChange: false
      validation: final-quality
  humanGates:
    - id: terminal-confirmation
      requires: [final-implementation-audit]
      if: "{{ parameters.require_human_verification }}"
      instructions: Run the repository's isolated local procedure and verify behavior in the real target terminal or environment.
      checklist:
        - Verify the primary interaction is usable end-to-end.
        - Verify denied and authorization paths are actually denied.
        - Verify compact, standard, and wide layouts remain reachable.
        - Verify repeated submission does not duplicate a pending mutation.
        - Verify backing out before submission causes no mutation.
      acknowledgement:
        type: exact-text
        value: "yes"
      skip:
        allowed_when: "{{ not parameters.require_human_verification }}"
  completion:
    validation: final-quality
    assertions: [{type: workspace-integrity}, {type: implementation-workspace-clean}]
    evidence: [audit-accepted]
  reset:
    allow: true
    requireCleanWorkspace: true
