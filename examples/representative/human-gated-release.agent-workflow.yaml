apiVersion: agentflow.dev/v1alpha2
kind: AgentWorkflow
metadata:
  name: representative-human-gated-release

spec:
  parameters:
    require_release_approval:
      type: boolean
      default: true
  workspace:
    allowWrites: [CHANGELOG.md, docs/**, examples/**]
    initialization:
      requireCleanWorkspace: true
      requireNamedBranch: true
  preconditions:
    - id: repository
      type: git-repository
      scope: initialization
  agents:
    releaser:
      runner: codex
      model: gpt-5.6-terra
      approval: never
  tools:
    release-check:
      type: shell
      command: make release-check
    scope:
      type: workspace-policy
      policy: spec.workspace.mutationPolicy
  validation:
    release-check:
      steps:
        - uses: scope
        - uses: release-check
  phases:
    - id: prepare-release
      kind: implementation
      actor: releaser
      prompt: Prepare the bounded release candidate and do not publish it.
      reasoning: Prepare only reviewable release artifacts; publication remains a human decision.
      requiresChange: true
      validation: release-check
  humanGates:
    - id: release-approval
      requires: [prepare-release]
      if: "{{ parameters.require_release_approval }}"
      instructions: Verify the release candidate in the target environment before approval.
      checklist:
        - Verify the release notes and version.
        - Verify the target environment behavior.
      acknowledgement:
        type: exact-text
        value: approve-release
      evidence:
        record: release-approved
        value: head_commit
  completion:
    validation: release-check
    assertions: [{type: implementation-workspace-clean}]
  reset:
    allow: true
    requireCleanWorkspace: true
