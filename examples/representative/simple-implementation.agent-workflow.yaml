apiVersion: agentflow.dev/v1alpha2
kind: AgentWorkflow
metadata:
  name: representative-simple-implementation

spec:
  workspace:
    allowWrites: [src/**, tests/**]
  agents:
    implementer:
      runner: codex
      model: gpt-5.6-terra
      sandbox: workspace-write
      approval: never
      ephemeral: true
      may_commit: true
      output_last_message: true
  validation:
    tests:
      run: make test
  phases:
    - id: implement
      actor: implementer
      prompt: Implement the bounded change and its focused tests.
      validation: tests
  completion:
    validation: tests
