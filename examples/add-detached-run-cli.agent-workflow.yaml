apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: add-detached-run-cli
  description: >-
    Repository-owned workflow to add a --detach CLI option for AgentFlow run
    execution. The workflow keeps foreground behavior unchanged, requires
    deterministic regression coverage and the canonical repository gate,
    independently audits process-lifecycle semantics, and records human
    verification before completion.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    canonical_gate: scripts/check.sh
    ci_policy: .github/workflows/quality.yml
    workflow_file: examples/add-detached-run-cli.agent-workflow.yaml
    runtime_reference: docs/reference/runtime.md

  state:
    backend: git-dir
    directory: .git/agentflow/add-detached-run-cli
    records:
      base_commit: base
      branch: branch
      active_phase: active-phase
      completed_phase_pattern: "{{ phase.id }}.done"
      manual_confirmation: detached-run-review
      workflow_complete: complete
    initialize:
      require_clean_implementation_workspace: true
      require_named_branch: true
      capture:
        base_commit: head_commit
        branch: current_branch
        integrity_baseline: true
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true
    lineage:
      require_base_commit_exists: true
      require_base_is_ancestor_of_head: true
      require_same_named_branch: true
    resume:
      enabled: true
      completed_phase_marker:
        value: head_commit
        valid_when_marker_commit_exists: true
        valid_when_marker_is_ancestor_of_head: true
      active_phase:
        fields:
          - phase_id
          - phase_start_commit
        require_phase_start_commit_exists: true
        require_phase_start_is_ancestor_of_head: true
        preserve_partial_commits: true
        preserve_partial_worktree_changes: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
      note: >-
        Runtime Git-backed state must not dirty the implementation worktree.
        The workflow definition itself is integrity-protected and is not in the
        mutation allowlist.
    cleanliness:
      before_first_run: required
      before_new_phase: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      allowed:
        - cmd/agentflow/**
        - docs/reference/runtime.md
        - README.md
        - CHANGELOG.md
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: roadmap
          paths: [ROADMAP.md]
          mode: exact-hash
        - id: research-documents
          paths: [docs/research/**]
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths: [scripts/check.sh]
          mode: exact-hash
        - id: detached-run-workflow
          paths: [examples/add-detached-run-cli.agent-workflow.yaml]
          mode: exact-hash
        - id: ci-validation-policy
          paths: [.github/workflows/quality.yml]
          mode: exact-hash

    checkpointing:
      agent_commits_allowed: true
      checkpoint_uncommitted_success: true
      stage_only_allowed_dirty_files: true
      commit_if_dirty: true
      commit_message: "AgentFlow detached run CLI: {{ phase.label }}"
      require_clean_after: true
      assert_scope_before_and_after: true

  agents:
    luna:
      runner: codex
      model: "{{ parameters.luna_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true
    terra:
      runner: codex
      model: "{{ parameters.terra_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true

  tools:
    assert-change-scope:
      type: workspace-policy
      policy: spec.workspace.mutationPolicy
      mutates_workspace: false
    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"
      mutates_workspace: false
      capture:
        stdout: true
        stderr: true
        log: "{{ temp.directory }}/gate-{{ invocation.id }}.log"
    checkpoint:
      type: git-checkpoint
      stage: allowed-dirty-files
      commit_if_dirty: true
      require_clean_after: true

  temp:
    directory: "{{ mktemp('${TMPDIR:-/tmp}/agentflow-detached-run.XXXXXX') }}"
    cleanup: on-exit

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg]
    - id: required-files
      type: files-exist
      paths:
        - cmd/agentflow/main.go
        - cmd/agentflow/main_test.go
        - "{{ spec.paths.runtime_reference }}"
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.ci_policy }}"
        - "{{ spec.paths.workflow_file }}"
    - id: ci-delegates-to-canonical-gate
      type: file-contains
      path: "{{ spec.paths.ci_policy }}"
      text: scripts/check.sh
    - id: saved-base-exists
      when: "{{ state.initialized }}"
      type: git-object-exists
      object: "{{ state.base_commit }}^{commit}"
    - id: saved-base-is-ancestor
      when: "{{ state.initialized }}"
      type: git-ancestor
      ancestor: "{{ state.base_commit }}"
      descendant: HEAD
    - id: branch-unchanged
      when: "{{ state.initialized }}"
      type: git-current-branch-equals
      expected: "{{ state.branch }}"
    - id: protected-boundaries-unchanged
      when: "{{ state.initialized }}"
      type: workspace-integrity
      policy: spec.workspace.mutationPolicy.integrity

  validation:
    starting-state:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      failure: fail-workflow

    implementation-gate:
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      onFailure:
        strategy: repair-once
        maxRepairAttempts: 1
        repair:
          actor: terra
          reasoning: high
          prompt: |
            The deterministic AgentFlow quality gate failed while implementing
            the --detach run feature.

            Diagnose the current checkout and repair only the failure necessary
            for this bounded feature. Preserve the mutation allowlist and every
            protected resource. Do not weaken scripts/check.sh, CI policy, the
            roadmap, research documents, or this workflow.

            The required behavioral contract is:
            - foreground `agentflow run` behavior remains unchanged;
            - `agentflow run --detach` starts the same run in a detached child
              process and the launcher returns after successful process start;
            - the child is not recursively detached;
            - the child does not depend on inherited stdin or the launcher
              process lifetime;
            - run arguments and parameter overrides are preserved;
            - non-run commands reject --detach clearly;
            - status/reset semantics and run identity remain compatible;
            - focused CLI/process tests and runtime documentation cover the
              behavior without adding an external dependency.

            --- gate output ---
            {{ tail(validation.failure.log, 260) }}
        then:
          - uses: assert-change-scope
          - uses: canonical-gate
        exhausted: fail-workflow

    audit-gate:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      failure: fail-workflow

    final-gate:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      failure: fail-workflow

  phaseDefaults:
    before:
      - require_clean_implementation_workspace: true
      - capture_phase_start_commit: true
      - persist_active_phase:
          fields:
            - phase_id
            - phase_start_commit

  phases:
    - id: implement-detached-run
      kind: implementation
      label: implement-detached-run-cli
      actor: luna
      reasoning: high
      requiresChange: true
      prompt: |
        Implement one bounded AgentFlow CLI feature: add `--detach` to the
        `run` command so a workflow can continue independently of the launching
        terminal/process.

        Inspect the current CLI, its tests, runtime documentation, and only the
        implementation needed for process detachment. Keep the engine's normal
        execution semantics unchanged unless a narrowly necessary refactor is
        required.

        Required contract:

        1. CLI surface
           - `agentflow run --detach -f workflow.yaml ...` is accepted.
           - Foreground `agentflow run` remains the default and behaves exactly
             as before.
           - `--detach` is rejected for `validate`, `status`, and `reset` with a
             clear command-specific error.
           - Update usage/help and docs/reference/runtime.md.

        2. Detached launch behavior
           - The launcher starts a new process of the same AgentFlow executable
             to execute the requested `run`.
           - Preserve the effective run arguments, including `-f`, `-C`,
             `--codex-bin`, and repeated `--set` values.
           - Remove or otherwise neutralize `--detach` in the child invocation
             so the child cannot recursively detach.
           - Return success only after the child process has been started
             successfully; return a useful error if start fails.
           - Print a concise launch confirmation that includes the child PID.

        3. Process lifetime
           - The child must not inherit stdin.
           - The child must not remain coupled to the launcher's signal context
             or terminal lifetime.
           - Use platform-appropriate process attributes behind small
             OS-specific helpers/build tags when necessary rather than placing
             non-portable syscall constants in shared code.
           - Do not add an external dependency for detachment.

        4. Runtime/state compatibility
           - The child must enter the ordinary `run` path so existing workflow
             validation, run identity, Git-backed state, recovery, checkpoints,
             human gates, and status/reset behavior remain authoritative.
           - Do not create a second workflow-state model for detached runs.
           - `status` remains the supported way to observe durable workflow
             state after launch.

        5. Regression coverage
           Add focused deterministic tests that verify at minimum:
           - foreground run does not take the detached path;
           - `--detach` is accepted only for `run`;
           - child arguments preserve run inputs and cannot recursively detach;
           - process-start errors propagate;
           - a detached helper process can outlive the launcher boundary on the
             current test platform without depending on stdin;
           - existing status JSON behavior continues to pass.

        Keep changes inside the workflow mutation allowlist. Prefer a small
        testable launch helper over embedding process construction directly in
        the switch statement. Run focused tests, gofmt, and the canonical gate
        before returning.
      after:
        - validate: implementation-gate
        - checkpoint: checkpoint
        - assertNetRepositoryChangeSincePhaseStart: true
        - markPhaseComplete:
            value: head_commit
        - clearActivePhase: true

    - id: audit-detached-run
      kind: audit
      label: audit-detached-run-cli
      actor: terra
      reasoning: high
      requiresChange: false
      prompt: |
        Independently audit the completed `agentflow run --detach` feature.

        Do not accept the implementation phase's completion claim as evidence.
        Inspect the actual diff from the saved base through HEAD, the CLI
        argument parsing, process-launch helper(s), tests, and runtime docs.
        Run focused tests as needed.

        Verify all of these points:
        - ordinary foreground run behavior and signal handling are unchanged;
        - --detach is run-only and cannot recursively propagate to the child;
        - child run arguments and repeated overrides are preserved;
        - launcher success means process start succeeded, not workflow success;
        - the detached child does not depend on launcher stdin, cancellation
          context, or terminal lifetime;
        - platform-specific process handling is isolated and compile-safe;
        - the child uses the normal engine/run-state path, so status, recovery,
          human gates, and completion markers remain authoritative;
        - tests exercise failure and lifecycle boundaries rather than only flag
          parsing;
        - documentation clearly explains detached launch and status monitoring;
        - no unrelated or protected files changed.

        Repair a genuine in-scope defect if necessary; otherwise leave the
        checkout unchanged. Do not broaden the feature or weaken validation.
      after:
        - validate: audit-gate
        - checkpoint: checkpoint
        - markPhaseComplete:
            value: head_commit
        - clearActivePhase: true

  recovery:
    activePhase:
      - readActivePhase:
          fields:
            - phase_id
            - phase_start_commit
      - restorePhaseDefinition: true
      - assertPhaseStartCommitExists: true
      - assertPhaseStartIsAncestorOfHead: true
      - validate_existing_state_first: true
      - if_invalid:
          - run_repair_policy: implementation-gate
          - if_still_incomplete:
              rerun_same_agent_phase_with_prefix: |
                Resume only this interrupted phase. Inspect existing commits
                and worktree changes first; preserve valid partial work rather
                than restarting the detached-run task.
      - runPhaseAfterSequence: true

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "Detached-run CLI workflow already completed at {{ state.workflow_complete.value }}"
        - stop: success
    - id: recover-interrupted-phase
      if: "{{ state.active_phase.exists }}"
      recover: activePhase
    - id: require-clean-after-recovery
      assert:
        type: implementation-workspace-clean
    - id: starting-state
      validate: starting-state
    - phase: implement-detached-run
    - phase: audit-detached-run
    - id: post-audit
      validate: audit-gate
    - id: post-audit-checkpoint
      checkpoint: checkpoint
      label: post-audit
    - human: detached-run-review
    - complete: detached-run-cli

  humanGates:
    - id: detached-run-review
      idempotent_record: "{{ state.manual_confirmation }}"
      requires: [audit-detached-run]
      after:
        - validation: post-audit
      instructions: >-
        Review the final diff and canonical gate output, then perform or inspect
        a representative detached launch. Confirm that the launcher returns
        after starting the child, that durable status remains observable after
        the launcher exits, and that normal foreground run behavior is
        unchanged.
      checklist:
        - id: cli-contract
          text: "The --detach option is limited to run and foreground run remains the default."
        - id: detached-lifetime
          text: "The detached child is independent of launcher stdin, cancellation, and terminal lifetime."
        - id: durable-observation
          text: "The normal AgentFlow state/status path remains the source of truth for the detached run."
        - id: tests-and-docs
          text: "Focused lifecycle tests and runtime documentation cover the feature."
        - id: scope-and-gate
          text: "Only allowed paths changed and scripts/check.sh passed on the audited checkout."
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        record: "{{ state.manual_confirmation }}"
        value: head_commit

  completion:
    detached-run-cli:
      assertions:
        - uses: assert-change-scope
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      checkpoint:
        uses: checkpoint
        label: detached-run-cli-complete
      afterCheckpointAssertions:
        - uses: assert-change-scope
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        record: "{{ state.workflow_complete }}"
        value: head_commit
      summary:
        title: "AgentFlow detached run CLI task complete."
        include:
          - branch
          - base_commit
          - head_commit
          - state_directory
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
