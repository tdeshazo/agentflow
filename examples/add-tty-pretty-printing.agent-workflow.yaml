apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: add-tty-pretty-printing
  description: >-
    Repository-owned workflow to add a general terminal presentation layer to
    AgentFlow and improve interactive human-gate confirmation. Human-facing
    output may use restrained semantic ANSI styling when the relevant output is
    a TTY, while JSON, YAML, logs, pipes, redirections, and other machine-facing
    streams preserve valid stable content. Interactive human gates confirm each
    checklist item before the final exact acknowledgement and persist evidence
    only after every required confirmation succeeds.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    canonical_gate: scripts/check.sh
    ci_policy: .github/workflows/quality.yml
    workflow_file: examples/add-tty-pretty-printing.agent-workflow.yaml
    runtime_reference: docs/reference/runtime.md

  state:
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
    cleanliness:
      before_first_run: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      allowed:
        - '*.go'
        - internal/engine/**
        - internal/clioutput/**
        - docs/reference/runtime.md
        - README.md
        - CHANGELOG.md
        - go.mod
        - go.sum
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: roadmap
          paths: [ROADMAP.md]
          mode: exact-hash
        - id: research-documents
          paths: [docs/research/**]
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths: [scripts/check.sh]
          mode: exact-hash
        - id: tty-pretty-print-workflow
          paths: [examples/add-tty-pretty-printing.agent-workflow.yaml]
          mode: exact-hash
        - id: ci-validation-policy
          paths: [.github/workflows/quality.yml]
          mode: exact-hash

  defaults:
    agent:
      runner: codex
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true
    lifecycle:
      policy: safe-resume
      validation: gate
    phases:
      implementation:
        actor: luna
        reasoning: high
        requiresChange: true
        validation: implementation-gate
      audit:
        actor: terra
        reasoning: high
        requiresChange: false
        validation: audit-gate
    repair:
      actor: terra
      reasoning: high
      prompt: |
        The deterministic AgentFlow quality gate failed while implementing the
        terminal presentation and human-gate UX task.

        Inspect the actual checkout and repair only the failure required by this
        bounded CLI/runtime task. Preserve the mutation allowlist and protected
        resources. Do not weaken scripts/check.sh, CI policy, the roadmap,
        research documents, or this workflow.

        Required invariants:
        - presentation changes never change workflow acceptance authority;
        - redirected, piped, and buffered human-readable output remains plain;
        - `NO_COLOR` disables ANSI styling without changing textual content;
        - JSON and YAML remain syntactically valid and contain no ANSI escapes;
        - logs, log following/tailing, detached durable logs, and provider output
          remain raw rather than being presentation-filtered;
        - terminal styling is based on the actual output destination;
        - interactive checklist prompts require terminal-backed stdin and stdout;
        - non-interactive human gates retain the existing single exact-text
          acknowledgement protocol;
        - an interactive human gate persists no evidence until every checklist
          item and the final acknowledgement have succeeded;
        - tests exercise TTY/color/interactivity branches deterministically
          without requiring a real PTY.

        --- gate output ---
        {{ tail(validation.failure.log, 260) }}

  agents:
    luna:
      model: "{{ parameters.luna_model }}"
    terra:
      model: "{{ parameters.terra_model }}"

  tools:
    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg]
    - id: required-files
      type: files-exist
      paths:
        - main.go
        - main_test.go
        - internal/engine/status.go
        - internal/engine/runtime_human.go
        - internal/clioutput/json.go
        - go.mod
        - "{{ spec.paths.runtime_reference }}"
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.ci_policy }}"
        - "{{ spec.paths.workflow_file }}"
    - id: ci-delegates-to-canonical-gate
      type: file-contains
      path: "{{ spec.paths.ci_policy }}"
      text: scripts/check.sh

  validation:
    gate:
      steps:
        - uses: canonical-gate
    starting-state:
      steps:
        - uses: canonical-gate
    implementation-gate:
      steps:
        - uses: canonical-gate
      repair: once
    audit-gate:
      steps:
        - uses: canonical-gate
    final-gate:
      steps:
        - uses: canonical-gate

  phases:
    - id: implement-terminal-presentation
      kind: implementation
      label: implement-general-tty-presentation
      prompt: |
        Build a small reusable terminal presentation layer and apply it to
        AgentFlow's human-facing command output without changing machine-facing
        contracts.

        Inspect `internal/clioutput/**`, `main.go`,
        `internal/engine/status.go`, current CLI tests, and runtime docs before
        changing anything.

        Required behavior:

        1. Presentation helper
           - Keep TTY detection based on the actual writer.
           - Add semantic roles for headings, labels, success, warning, error,
             accent/progress, and muted text.
           - Use restrained ANSI styling only when output is a TTY.
           - Honor `NO_COLOR`: when it is present, emit the same human-readable
             text without ANSI sequences.
           - Unknown writers remain non-TTY by default.
           - Provide deterministic seams so TTY=true/false and color=true/false
             can be tested with ordinary buffers.

        2. Human-readable status
           - Style labels and state values for `status -f ...` and
             `status --all` when stdout is a terminal.
           - Preserve the existing plain-text bytes for redirected, piped, and
             buffered output, including `NO_COLOR` terminal mode apart from the
             absence of ANSI styling.
           - Do not change status state derivation, authority, schema, ordering,
             omission rules, or process-liveness semantics.

        3. Validation, usage, errors, and confirmations
           - Give terminal validation outcomes semantic success/warning/error
             emphasis.
           - Style the CLI usage label and top-level `agentflow:` error prefix.
           - Style detached-run confirmation as success.
           - Preserve the underlying text and exit behavior in non-TTY output.

        4. Structured/raw boundaries
           - Keep `status --json` and `status --all --json` valid JSON with no
             ANSI escapes. TTY JSON may remain indented and non-TTY JSON compact.
           - Keep `plan --expanded` valid YAML with no ANSI escapes.
           - Do not transform workflow logs, `--follow`, `--tail`, detached log
             capture, or provider stdout/stderr.

        Add focused deterministic tests for semantic roles, state styling,
        `NO_COLOR`/no-color behavior, TTY text status, non-TTY text stability,
        and ANSI-free structured output.

    - id: improve-human-gate-interaction
      kind: implementation
      label: implement-interactive-human-checklist-confirmation
      prompt: |
        Improve human-gate terminal UX while preserving the durable gate model
        and non-interactive compatibility.

        Inspect `internal/engine/runtime_human.go`, the `HumanGate` model and
        specification reference, self-hosting runtime tests, and existing human
        gate examples before changing anything.

        Required behavior:

        1. Interactive detection
           - Enter checklist-by-checklist confirmation only when both the input
             and output are terminal-backed.
           - Provide an injectable/testable interactivity seam; tests must not
             require a real PTY.
           - Pipes, buffers, and programmatic readers retain the existing
             non-interactive protocol.

        2. Checklist UX
           - Present each required checklist item as an explicit prompt ending
             in `[y/N]: `.
           - Accept `y` or `yes`, case-insensitively, for each item.
           - Any other answer fails the human gate immediately with deterministic
             context naming the rejected checklist item.
           - After all items pass, retain the workflow-declared exact-text final
             acknowledgement. Do not silently reinterpret or bypass it.

        3. Evidence authority
           - Do not persist the human-gate evidence record after an individual
             checklist answer.
           - Persist evidence only after all interactive checklist items and the
             final acknowledgement succeed.
           - Existing idempotent-record, prerequisite, condition, skip, and
             evidence-record semantics remain unchanged.

        4. Presentation
           - Give terminal human-gate headings, prompts, warnings, successful
             confirmation, and completion summaries semantic styling through the
             shared presentation helper.
           - `NO_COLOR` removes ANSI without disabling interactive prompts.
           - Non-TTY human-gate output keeps the existing text/protocol so current
             tests and non-interactive callers that provide one `yes` line remain
             compatible.

        Add deterministic regression tests proving that all interactive checklist
        items must pass, rejected items write no human evidence, the final exact
        acknowledgement remains required, and non-interactive behavior remains
        backward compatible.

    - id: audit-terminal-presentation
      kind: audit
      label: independently-audit-terminal-presentation-and-human-gates
      validation: audit-gate
      prompt: |
        Independently audit the final checkout for the terminal presentation and
        human-gate interaction task.

        Do not accept implementation completion claims as evidence. Inspect the
        actual changed files and compare the saved base through HEAD. Verify:

        - ANSI appears only in terminal-oriented human presentation;
        - `NO_COLOR` produces plain text without disabling terminal checklist UX;
        - non-TTY human-readable output stays backward compatible;
        - JSON/YAML are valid and ANSI-free;
        - logs, detached capture, follow/tail, and provider output remain raw;
        - status state/schema/authority semantics are unchanged;
        - interactive checklist confirmation requires terminal input and output;
        - every checklist item must be confirmed before the final exact-text
          acknowledgement;
        - rejected checklist input cannot write durable human evidence;
        - non-interactive human gates still accept the historical single exact
          acknowledgement line;
        - tests cover TTY/color/interactivity branches without a live PTY;
        - dependency and module metadata remain minimal and correct;
        - no protected resource or unrelated path changed.

        Run focused tests and the canonical gate. Repair a genuine in-scope
        defect if needed; otherwise leave the checkout unchanged. Do not turn
        this into a full-screen UI, dynamic terminal-width renderer, or styling
        layer for raw machine/log/provider streams.

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "TTY presentation and human-gate UX already completed at {{ state.workflow_complete.value }}"
        - stop: success
    - id: starting-state
      validate: starting-state
    - phase: implement-terminal-presentation
    - phase: improve-human-gate-interaction
    - phase: audit-terminal-presentation
    - id: post-audit
      validate: audit-gate
    - human: terminal-output-review
    - complete: tty-pretty-printing

  humanGates:
    - id: terminal-output-review
      requires: [audit-terminal-presentation]
      after:
        - validation: post-audit
      instructions: >-
        Verify the final CLI in a real terminal and through pipes/redirection.
        Confirm that human-facing status, validation/results, errors, human-gate
        prompts, and completion output are readable in a TTY; NO_COLOR removes
        ANSI; machine/raw streams stay clean; and this gate itself prompts for
        each checklist item before the final acknowledgement.
      checklist:
        - id: terminal-styling-readable
          text: "Human-facing status and command results use restrained readable terminal styling."
        - id: no-color-and-pipes-clean
          text: "NO_COLOR and non-TTY output remain plain, while JSON/YAML/log streams contain no ANSI escapes."
        - id: human-checklist-interactive
          text: "This human gate prompts for each checklist item with [y/N] before the final exact acknowledgement."
        - id: raw-streams-unchanged
          text: "Workflow logs, follow/tail output, detached log capture, and provider output remain raw."
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        value: head_commit

  completion:
    tty-pretty-printing:
      assertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      afterCheckpointAssertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        value: head_commit
      summary:
        title: "TTY presentation and human-gate UX complete."
        include:
          - branch
          - base_commit
          - head_commit
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
