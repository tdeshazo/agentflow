apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: add-tty-pretty-printing
  description: >-
    Repository-owned workflow to pretty-print machine-readable AgentFlow status
    JSON when stdout is an interactive terminal while preserving compact,
    script-friendly JSON when output is piped or redirected. The workflow keeps
    TTY detection in the presentation layer, requires deterministic regression
    coverage for both output modes, independently audits compatibility, and
    records a real-terminal verification before completion.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    canonical_gate: scripts/check.sh
    ci_policy: .github/workflows/quality.yml
    workflow_file: examples/add-tty-pretty-printing.agent-workflow.yaml
    runtime_reference: docs/reference/runtime.md

  state:
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
    cleanliness:
      before_first_run: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      allowed:
        - cmd/agentflow/**
        - internal/engine/**
        - internal/clioutput/**
        - docs/reference/runtime.md
        - README.md
        - CHANGELOG.md
        - go.mod
        - go.sum
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: roadmap
          paths: [ROADMAP.md]
          mode: exact-hash
        - id: research-documents
          paths: [docs/research/**]
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths: [scripts/check.sh]
          mode: exact-hash
        - id: tty-pretty-print-workflow
          paths: [examples/add-tty-pretty-printing.agent-workflow.yaml]
          mode: exact-hash
        - id: ci-validation-policy
          paths: [.github/workflows/quality.yml]
          mode: exact-hash

  defaults:
    agent:
      runner: codex
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true
    lifecycle:
      policy: safe-resume
      validation: gate
    phases:
      implementation:
        actor: luna
        reasoning: high
        requiresChange: true
        validation: implementation-gate
      audit:
        actor: terra
        reasoning: high
        requiresChange: false
        validation: audit-gate
    repair:
      actor: terra
      reasoning: high
      prompt: |
        The deterministic AgentFlow quality gate failed while implementing
        TTY-aware JSON pretty printing.

        Inspect the actual checkout and repair only the failure required by this
        bounded output-formatting task. Preserve the mutation allowlist and
        protected resources. Do not weaken scripts/check.sh, CI policy, the
        roadmap, research documents, or this workflow.

        Required invariants:
        - `status --json` remains valid JSON in every output mode;
        - `status --all --json` remains valid JSON in every output mode;
        - interactive terminal output is indented and readable;
        - piped or redirected output remains compact and automation-friendly;
        - the JSON schema, field names, values, and omission behavior do not
          change merely because output formatting changes;
        - TTY detection is based on the actual output destination, not stdin;
        - non-JSON status, logs, plan, validation, run, and reset behavior are
          unchanged by this task;
        - tests do not depend on a developer having a real terminal attached;
        - no new terminal dependency is added when the existing module graph can
          support the implementation cleanly.

        --- gate output ---
        {{ tail(validation.failure.log, 260) }}

  agents:
    luna:
      model: "{{ parameters.luna_model }}"
    terra:
      model: "{{ parameters.terra_model }}"

  tools:
    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg]
    - id: required-files
      type: files-exist
      paths:
        - cmd/agentflow/main.go
        - cmd/agentflow/main_test.go
        - internal/engine/status.go
        - go.mod
        - "{{ spec.paths.runtime_reference }}"
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.ci_policy }}"
        - "{{ spec.paths.workflow_file }}"
    - id: ci-delegates-to-canonical-gate
      type: file-contains
      path: "{{ spec.paths.ci_policy }}"
      text: scripts/check.sh

  validation:
    gate:
      steps:
        - uses: canonical-gate
    starting-state:
      steps:
        - uses: canonical-gate
    implementation-gate:
      steps:
        - uses: canonical-gate
      repair: once
    audit-gate:
      steps:
        - uses: canonical-gate
    final-gate:
      steps:
        - uses: canonical-gate

  phases:
    - id: implement-pretty-json
      kind: implementation
      label: implement-tty-aware-json-formatting
      prompt: |
        Add TTY-aware pretty printing for AgentFlow's explicit JSON status
        output without changing the underlying status contract.

        Inspect `cmd/agentflow/main.go`, `cmd/agentflow/main_test.go`,
        `internal/engine/status.go`, the runtime documentation, and the current
        module dependencies before changing anything.

        Required behavior:

        1. Single-workflow JSON status
           `agentflow status --json -f <workflow> ...`
           - If the command's stdout destination is an interactive terminal,
             emit the existing JSON object with stable indentation suitable for
             a human to read, followed by a final newline.
           - If stdout is a pipe, regular file, buffer, or another non-TTY
             destination, preserve compact single-object JSON output followed by
             a final newline.

        2. Repository-wide JSON status
           `agentflow status --all --json ...`
           - Apply the same TTY-aware formatting policy to the existing
             collection object.
           - Do not change collection schema, workflow ordering, state
             projection, process-liveness semantics, or malformed-entry
             handling.

        3. Presentation boundary
           - Detect TTY state from stdout/the actual output writer, never stdin.
           - Keep terminal detection and JSON formatting as presentation
             concerns; they must not become durable workflow state or influence
             execution/acceptance semantics.
           - Prefer one small shared output helper so the single-workflow and
             repository-wide JSON paths cannot drift. `internal/clioutput/**`
             is available for that helper if a shared package is the cleanest
             implementation.
           - The current module already carries `github.com/mattn/go-isatty`
             indirectly. Prefer the existing dependency when suitable. If it is
             imported directly, update module metadata correctly rather than
             adding a second TTY library.
           - Treat unknown/non-file `io.Writer` destinations as non-TTY unless
             there is deterministic evidence otherwise.
           - Do not add ANSI color or terminal-width-dependent layout.

        4. Compatibility
           - Keep current JSON field names, values, `omitempty` behavior, and
             semantic content unchanged.
           - Keep non-JSON `status` output unchanged.
           - Keep `logs` byte-stream behavior unchanged; in particular do not
             reformat the line-oriented durable log stream.
           - Keep `plan --expanded`, validation diagnostics, run output, reset,
             detached execution, and exit/error behavior unchanged.

        5. Regression coverage
           Add focused deterministic tests proving:
           - pretty mode produces multi-line indented valid JSON;
           - compact mode produces valid one-line JSON;
           - both modes decode to equivalent data;
           - `status --json` and `status --all --json` use the same policy;
           - redirected/pipe-oriented CLI tests remain compact;
           - non-JSON status and logs are not routed through JSON pretty
             printing.

        Tests must exercise the formatting branch without requiring a real PTY;
        factor the detection/encoding seam so TTY=true and TTY=false can be
        tested deterministically. Run focused tests and the canonical gate
        before returning.

    - id: audit-pretty-json
      kind: audit
      label: independently-audit-tty-aware-json-formatting
      validation: audit-gate
      prompt: |
        Independently audit the final checkout for the TTY-aware JSON pretty
        printing task.

        Do not accept the implementation phase's completion claim as evidence.
        Inspect the changed files and compare the saved base through HEAD.
        Verify all of the following from code and tests:

        - stdout, not stdin, controls terminal formatting;
        - terminal JSON is indented but semantically identical to compact JSON;
        - non-TTY JSON remains compact and suitable for shell pipelines;
        - single-workflow and `--all` JSON share the same formatting policy;
        - JSON schema and status authority semantics are unchanged;
        - line-oriented workflow logs are untouched;
        - non-JSON CLI output remains backward compatible;
        - tests cover both formatter branches deterministically without a live
          terminal dependency;
        - dependency changes, if any, are minimal and correctly represented in
          go.mod/go.sum;
        - no protected resource or unrelated path changed.

        Run focused tests as useful and the canonical gate. Repair a genuine
        in-scope defect if needed; otherwise leave the checkout unchanged. Do
        not broaden the feature into color, tables, width-aware rendering, or
        general CLI redesign.

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "TTY-aware JSON pretty printing already completed at {{ state.workflow_complete.value }}"
        - stop: success
    - id: starting-state
      validate: starting-state
    - phase: implement-pretty-json
    - phase: audit-pretty-json
    - id: post-audit
      validate: audit-gate
    - human: terminal-output-review
    - complete: tty-pretty-printing

  humanGates:
    - id: terminal-output-review
      requires: [audit-pretty-json]
      after:
        - validation: post-audit
      instructions: >-
        Verify the final CLI behavior in a real interactive terminal and once
        through a pipe or redirection. Confirm that explicit status JSON is
        readable when stdout is a terminal, remains compact when stdout is not
        a terminal, and parses successfully in both cases. Also confirm that
        ordinary text status and workflow logs retain their prior presentation.
      checklist:
        - id: tty-json-readable
          text: "status --json and status --all --json are indented and readable when stdout is a TTY."
        - id: piped-json-compact
          text: "The same JSON commands stay compact and valid when piped or redirected."
        - id: non-json-unchanged
          text: "Text status and workflow log output remain backward compatible."
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        value: head_commit

  completion:
    tty-pretty-printing:
      assertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      afterCheckpointAssertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        value: head_commit
      summary:
        title: "TTY-aware JSON pretty printing complete."
        include:
          - branch
          - base_commit
          - head_commit
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
