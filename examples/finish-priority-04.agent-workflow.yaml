apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: finish-priority-04
  description: >-
    Self-hosted workflow for completing Priority 4 — Runtime-owned orchestration
    and concise SDL authoring. The workflow uses the current verbose v1alpha1
    lifecycle as a bootstrap contract while implementing runtime-owned lifecycle
    and recovery, deterministic progress/bookkeeping, content-addressed validation
    evidence, concise authoring defaults, expanded planning, and migration of the
    repository's two primary authoring benchmarks.
  source:
    type: roadmap
    file: ROADMAP.md

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    luna_model:
      type: string
      default: "gpt-5.6-luna"
      env: LUNA_MODEL
    terra_model:
      type: string
      default: "gpt-5.6-terra"
      env: TERRA_MODEL
    require_authoring_review:
      type: boolean
      default: true
      env: REQUIRE_AUTHORING_REVIEW
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    roadmap: ROADMAP.md
    canonical_gate: scripts/check.sh
    quality_workflow: .github/workflows/quality.yml
    self_host_workflow: examples/develop-agentflow.agent-workflow.yaml
    priority5_workflow: examples/finish-priority-05.agent-workflow.yaml
    priority4_workflow: examples/finish-priority-04.agent-workflow.yaml
    priority4_evidence: docs/evidence/priority-4-concision.md

  state:
    backend: git-dir
    directory: .git/agentflow/finish-priority-04
    records:
      base_commit: base
      branch: branch
      active_phase: active-phase
      completed_phase_pattern: "{{ phase.id }}.done"
      manual_confirmation: priority-4-authoring-review
      workflow_complete: complete

    initialize:
      require_clean_implementation_workspace: true
      require_named_branch: true
      capture:
        base_commit: head_commit
        branch: current_branch
        integrity_baseline: true

    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

    lineage:
      require_base_commit_exists: true
      require_base_is_ancestor_of_head: true
      require_same_named_branch: true

    resume:
      enabled: true
      completed_phase_marker:
        value: head_commit
        valid_when_marker_commit_exists: true
        valid_when_marker_is_ancestor_of_head: true
      active_phase:
        fields:
          - phase_id
          - phase_start_commit
        require_phase_start_commit_exists: true
        require_phase_start_is_ancestor_of_head: true
        preserve_partial_commits: true
        preserve_partial_worktree_changes: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git

    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
      note: >-
        The workflow definition is ignored only for implementation dirtiness.
        It remains outside the mutation allowlist and is protected by an exact
        integrity baseline.

    cleanliness:
      before_first_run: required
      before_new_phase: required
      outside_recoverable_active_phase: required
      after_checkpoint: required

    mutationPolicy:
      allowed:
        - cmd/**
        - internal/**
        - provider/**
        - spec/**
        - docs/**
        - skills/agentflow-spec/**
        - examples/develop-agentflow.agent-workflow.yaml
        - examples/finish-priority-05.agent-workflow.yaml
        - README.md
        - CHANGELOG.md
        - CONTRIBUTING.md
        - go.mod
        - go.sum

      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true

      integrity:
        - id: roadmap
          paths:
            - ROADMAP.md
          mode: exact-hash

        - id: research-documents
          paths:
            - docs/research/**
          mode: group-exact-hash

        - id: canonical-quality-gate
          paths:
            - scripts/check.sh
          mode: exact-hash

        - id: ci-validation-policy
          paths:
            - .github/workflows/quality.yml
          mode: exact-hash

        - id: priority-4-bootstrap-workflow
          paths:
            - examples/finish-priority-04.agent-workflow.yaml
          mode: exact-hash

    checkpointing:
      agent_commits_allowed: true
      checkpoint_uncommitted_success: true
      stage_only_allowed_dirty_files: true
      commit_if_dirty: true
      commit_message: "Complete Priority 4: {{ phase.label }}"
      require_clean_after: true
      assert_scope_before_and_after: true

  agents:
    luna:
      runner: codex
      model: "{{ parameters.luna_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true

    terra:
      runner: codex
      model: "{{ parameters.terra_model }}"
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true

  tools:
    assert-change-scope:
      type: workspace-policy
      policy: spec.workspace.mutationPolicy
      mutates_workspace: false

    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"
      mutates_workspace: false
      capture:
        stdout: true
        stderr: true
        log: "{{ temp.directory }}/gate-{{ invocation.id }}.log"

    priority4-contract:
      type: shell
      command: >-
        go test ./internal/workflow ./internal/engine ./. &&
        go run . plan --expanded -f {{ spec.paths.self_host_workflow }} >/dev/null &&
        go run . plan --expanded -f {{ spec.paths.priority5_workflow }} >/dev/null
      mutates_workspace: false
      capture:
        stdout: true
        stderr: true
        log: "{{ temp.directory }}/priority4-contract-{{ invocation.id }}.log"

    checkpoint:
      type: git-checkpoint
      stage: allowed-dirty-files
      commit_if_dirty: true
      require_clean_after: true

    assert-regex:
      type: file-regex
      mutates_workspace: false

  temp:
    directory: "{{ mktemp('${TMPDIR:-/tmp}/agentflow-priority4.XXXXXX') }}"
    cleanup: on-exit

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"

    - id: required-commands
      type: commands-exist
      commands:
        - git
        - codex
        - sh
        - bash
        - go
        - gofmt
        - rg

    - id: required-files
      type: files-exist
      paths:
        - "{{ spec.paths.roadmap }}"
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.quality_workflow }}"
        - "{{ spec.paths.self_host_workflow }}"
        - "{{ spec.paths.priority5_workflow }}"
        - "{{ spec.paths.priority4_workflow }}"

    - id: quality-workflow-delegates-to-canonical-gate
      type: file-contains
      path: "{{ spec.paths.quality_workflow }}"
      text: scripts/check.sh

    - id: priority-4-roadmap-present
      type: file-contains
      path: "{{ spec.paths.roadmap }}"
      text: "Priority 4 — Runtime-owned orchestration and concise SDL authoring"

    - id: saved-base-exists
      when: "{{ state.initialized }}"
      type: git-object-exists
      object: "{{ state.base_commit }}^{commit}"

    - id: saved-base-is-ancestor
      when: "{{ state.initialized }}"
      type: git-ancestor
      ancestor: "{{ state.base_commit }}"
      descendant: HEAD

    - id: branch-unchanged
      when: "{{ state.initialized }}"
      type: git-current-branch-equals
      expected: "{{ state.branch }}"

    - id: protected-boundaries-unchanged
      when: "{{ state.initialized }}"
      type: workspace-integrity
      policy: spec.workspace.mutationPolicy.integrity

  validation:
    starting-state:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      failure: fail-workflow

    phase-gate:
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate

      onFailure:
        strategy: repair-once
        maxRepairAttempts: 1
        repair:
          actor: terra
          reasoning: high
          prompt: |
            The deterministic AgentFlow quality gate failed while completing
            Priority 4.

            Current phase:
            {{ phase.label }}

            Inspect the actual checkout and repair only the failure required for
            this phase. Preserve ROADMAP.md, scripts/check.sh, CI policy,
            docs/research, and the Priority 4 bootstrap workflow. Do not weaken
            safety checks or broaden the current phase.

            --- gate output ---
            {{ tail(validation.failure.log, 260) }}
        then:
          - uses: assert-change-scope
          - uses: canonical-gate
        exhausted: fail-workflow

    audit-gate:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
      failure: fail-workflow

    priority4-acceptance:
      repair: none
      steps:
        - uses: assert-change-scope
        - uses: canonical-gate
        - uses: priority4-contract
      failure: fail-workflow

  phaseDefaults:
    before:
      - require_clean_implementation_workspace: true
      - capture_phase_start_commit: true
      - persist_active_phase:
          fields:
            - phase_id
            - phase_start_commit

    after:
      - validate: phase-gate
      - checkpoint: checkpoint
      - if: "{{ phase.requiresChange }}"
        assertNetRepositoryChangeSincePhaseStart: true
      - markPhaseComplete:
          value: head_commit
      - clearActivePhase: true

    skip:
      completedMarker: skip

  phases:
    - id: "01"
      kind: implementation
      label: runtime-owned-phase-lifecycle-and-recovery
      actor: luna
      reasoning: high
      requiresChange: true
      prompt: |
        Implement the first Priority 4 slice: runtime-owned phase lifecycle and
        recovery.

        Read ROADMAP.md Priority 4, the current workflow model/validator, runtime
        lifecycle/recovery code, durability tests, and the shipped workflows
        before changing anything.

        The result must make the normal safe lifecycle a runtime contract rather
        than authored procedural YAML. In particular:

        - define a concise lifecycle policy/default for mutable AI phases;
        - have the runtime own clean phase boundaries, phase-start capture,
          durable active/actor-completion state, deterministic validation,
          accepted-work checkpointing, completed-phase evidence, and active-state
          cleanup;
        - derive normal interrupted-phase recovery from durable phase state and
          lifecycle policy;
        - preserve partial commits and working-tree changes when safe, validating
          them before rerunning an actor;
        - keep explicit escape hatches for genuinely non-default recovery without
          allowing an override to bypass deterministic acceptance;
        - continuously enforce mutation scope, protected integrity, Git lineage,
          and cleanliness at the relevant runtime mutation/acceptance boundaries;
        - centralize duplicate lineage/safety declarations where that does not
          weaken semantics;
        - preserve legacy v1alpha1 documents so the bootstrap workflow and existing
          examples remain valid and executable.

        Add deterministic tests for clean start, interruption after actor work,
        interruption around checkpointing, partial commits, dirty partial work,
        invalid lineage, protected-resource mutation, scope violation, resumed
        acceptance, and completed-marker validity.

        Update the authoritative specification/runtime documentation for the
        implemented lifecycle semantics. Do not implement Priority 4 progress,
        validation caching, or broad authoring-default work beyond interfaces
        strictly necessary for this slice.

    - id: "02"
      kind: implementation
      label: engine-owned-progress-and-bookkeeping
      actor: terra
      reasoning: high
      requiresChange: true
      prompt: |
        Implement the second Priority 4 slice: engine-owned progress and
        deterministic bookkeeping.

        Build on the runtime-owned lifecycle from the prior phase. The actor
        implements work; deterministic acceptance owns acceptance state.

        Required behavior:

        - allow phases to target progress criteria by stable criterion ID instead
          of repeating full criterion text;
        - allow successful deterministic phase acceptance to advance exactly the
          declared targeted progress item;
        - enforce that only the target advances and that the declared progress
          delta is satisfied;
        - prevent the actor from being the authority that marks its own criterion
          complete;
        - add deterministic structured Markdown bookkeeping for constrained
          checklist/status/index transitions when the transition is fully
          declarative;
        - preserve all non-bookkeeping content by construction, preferring
          Markdown-aware operations over sed-style normalization;
        - make bookkeeping transitions durable and resume-safe;
        - fail closed on ambiguous/missing/duplicate targets and on any mutation
          outside the declared bookkeeping boundary.

        Add focused model, validation, runtime, recovery, and Markdown mutation
        tests. Include regression coverage showing a criterion cannot close a
        different item or manufacture extra progress.

        Update specification and runtime documentation, including the local
        agentflow-spec reference when field semantics change.

        Do not yet migrate the benchmark workflows; keep this phase focused on
        the engine primitives and their deterministic authority.

    - id: "03"
      kind: implementation
      label: content-addressed-validation-evidence
      actor: luna
      reasoning: high
      requiresChange: true
      prompt: |
        Implement the third Priority 4 slice: durable content-addressed
        deterministic validation evidence.

        A successful deterministic validation may be reused only when its
        meaning and relevant workspace identity are unchanged.

        Required behavior:

        - produce durable success evidence keyed by the validation/tool
          definition, resolved non-secret inputs, relevant workspace/content
          identity, and declared policy/dependencies;
        - reuse successful evidence for an equivalent later validation request;
        - invalidate evidence when relevant files, tool definitions, resolved
          inputs, policy, declared dependencies, or other acceptance-relevant
          identity changes;
        - never reuse a stale success across a safety violation, failed lineage or
          integrity boundary, or changed repair policy;
        - preserve gate-specific repair budgets and failure classification;
        - after repair, rerun the deterministic validation before producing new
          success evidence;
        - retain bounded failure output needed by repair actors without persisting
          secrets, complete environments, or unnecessary prompt content;
        - namespace evidence so concurrent/different workflows cannot collide.

        Make the canonical repository gate the principal benchmark. Add
        deterministic tests that count tool invocations: identical gate + inputs
        + relevant tree should execute once and reuse evidence later, while each
        declared dependency change forces execution again. Include restart/resume
        tests proving evidence survives process interruption without becoming
        over-broad authority.

        Update the authoritative docs. Do not introduce general-purpose artifact
        caching or Priority 6 typed evidence contracts beyond what Priority 4
        requires for deterministic validation.

    - id: "04"
      kind: implementation
      label: concise-authoring-and-expanded-plan
      actor: terra
      reasoning: high
      requiresChange: true
      prompt: |
        Implement the fourth Priority 4 slice: concise authoring defaults plus a
        fully inspectable normalized executable plan.

        Use the existing verbose workflows as concrete repetition data. Reduce
        authoring surface only where semantics remain explicit after
        normalization.

        Required authoring capabilities:

        - inherited agent/executor defaults for runner, sandbox, approval,
          ephemeral, commit, output, and similar repeated capability settings;
        - phase-kind and lifecycle defaults with explicit local overrides;
        - concise named references and stable uses/with/if patterns where they
          materially remove repetition without mixing actor, mutation, and
          validation authority;
        - concise bounded repair configuration where the default behavior reruns
          the same deterministic validation after repair;
        - typed parameter defaults plus env override spelling without embedding
          shell-style fallback expressions;
        - runtime-owned temporary/log/Git-record plumbing unless it is an
          observable semantic requirement;
        - domain prompts that no longer need generic lifecycle, checkpoint, resume,
          or self-acceptance instructions.

        Add a normalization stage that compiles authoring syntax plus runtime
        defaults into an explicit executable representation before execution.
        Validate both the authored document and the normalized representation.

        Add `agentflow plan --expanded -f <workflow>` and make it expose the
        resolved lifecycle, recovery behavior, safety enforcement points,
        validation/repair semantics, progress transitions, checkpoint behavior,
        human gates, and completion contract without executing actors or mutable
        tools.

        Preserve old v1alpha1 syntax. If any desired grammar cannot be introduced
        compatibly, introduce a new alpha API version with an explicit migration
        path instead of silently redefining existing v1alpha1 fields.

        Add conformance, CLI, normalization, and semantic-equivalence tests. Update
        specification/runtime/guides and the describer reference.

    - id: "05"
      kind: implementation
      label: migrate-priority4-authoring-benchmarks
      actor: luna
      reasoning: high
      requiresChange: true
      prompt: |
        Migrate the two Priority 4 benchmark workflows to the concise authoring
        surface now implemented:

        - examples/develop-agentflow.agent-workflow.yaml
        - examples/finish-priority-05.agent-workflow.yaml

        Preserve their existing authority and execution guarantees. This is a
        semantic migration, not a redesign of their domain work.

        Required benchmark outcomes:

        - normal safe resume no longer requires an explicit procedural recovery
          sequence;
        - scope, protected integrity, lineage, and cleanliness policy are declared
          once and enforced by the runtime at every required boundary;
        - common agent/executor settings are inherited rather than duplicated;
        - common phase lifecycle behavior and repair policy are inherited/reused;
        - criterion phases reference stable criterion IDs;
        - criterion prompts no longer tell an actor to mark its own acceptance
          checkbox;
        - deterministic acceptance advances criterion progress;
        - the Priority 5 bookkeeping-only model phase is replaced by deterministic
          constrained bookkeeping;
        - repeated canonical validation against the same relevant tree can reuse
          successful evidence;
        - temporary-directory, gate-log, Git-record, and similar interpreter
          plumbing disappear from authored YAML where they are not semantic
          requirements;
        - `agentflow plan --expanded` for each migrated workflow preserves an
          inspectable lifecycle/recovery/validation/progress/completion contract;
        - actor authority, workspace mutation authority, and deterministic
          validation authority remain structurally distinct.

        Add or strengthen deterministic equivalence/conformance tests so future
        changes cannot regain concision by dropping safety semantics.

        Create or update docs/evidence/priority-4-concision.md. Record the method
        used to compare non-prompt orchestration surface before/after, the measured
        reductions for both benchmark workflows, the key removed boilerplate
        categories, and representative expanded-plan evidence. Do not manipulate
        the measurement to reach a predetermined percentage; report the actual
        result and explain whether it is materially smaller.

        Do not modify ROADMAP.md or the Priority 4 bootstrap workflow.

    - id: "06"
      kind: audit
      label: priority4-integration-and-regression-audit
      actor: terra
      reasoning: high
      requiresChange: false
      prompt: |
        Independently audit Priority 4 across the current checkout.

        Do not treat prior agent completion claims as evidence. Inspect the actual
        model, validator, normalization layer, engine, durable state, validation
        evidence, CLI, benchmark workflows, tests, and documentation.

        Verify at least:

        - default lifecycle/recovery is runtime-owned and safe under interruption;
        - explicit lifecycle/recovery overrides cannot bypass acceptance;
        - workspace scope, integrity, lineage, and cleanliness are continuously
          enforced rather than merely declared;
        - progress by stable ID is deterministic and only the target can advance;
        - structured bookkeeping cannot rewrite unrelated Markdown;
        - validation evidence is content/policy addressed, durable, bounded, and
          invalidated on every declared relevant change;
        - safety failures and repair budgets are never hidden by cached success;
        - normalization is validated and does not create hidden unsupported
          behavior;
        - expanded plan exposes every runtime-generated acceptance/recovery
          transition needed to review the workflow contract;
        - legacy v1alpha1 documents still validate and execute;
        - both benchmark workflows retain their mutation, validation, repair,
          recovery, human-gate, and completion guarantees while being materially
          smaller outside prompts.

        Run focused tests in addition to the canonical gate where useful. Repair
        genuine in-scope defects and strengthen regression coverage, but do not
        add Priority 5 DAG scheduling or Priority 6 typed artifact features.

    - id: "07"
      kind: audit
      label: final-priority4-authority-audit
      actor: luna
      reasoning: high
      requiresChange: false
      prompt: |
        Perform the final Priority 4 authority and authoring audit.

        Read ROADMAP.md Priority 4 exit criteria and verify each one against the
        actual repository state. Pay special attention to cases where concise
        syntax could hide authority:

        - actor success must never authorize advancement;
        - mutation authority must remain separate from lifecycle defaults;
        - deterministic validation must remain the acceptance authority;
        - recovered partial work must be validated before acceptance;
        - cached evidence must be demonstrably tied to unchanged relevant state;
        - deterministic bookkeeping must be narrower than general file mutation;
        - expanded plan must reveal defaults rather than merely summarize them;
        - the benchmark workflows must be readable primarily as domain policy and
          work intent.

        Inspect docs/evidence/priority-4-concision.md and reproduce enough of its
        measurements/plan checks to detect misleading evidence.

        Repair only genuine Priority 4 defects. Do not edit ROADMAP.md, weaken the
        canonical gate, or broaden into dependency scheduling.

  recovery:
    activePhase:
      - readActivePhase:
          fields:
            - phase_id
            - phase_start_commit
      - restorePhaseDefinition: true
      - assertPhaseStartCommitExists: true
      - assertPhaseStartIsAncestorOfHead: true
      - validate_existing_state_first: true
      - if_invalid:
          - run_repair_policy: phase-gate
          - if_still_incomplete:
              rerun_same_agent_phase_with_prefix: |
                Resume only this interrupted Priority 4 phase. Inspect existing
                commits and working-tree changes first, preserve valid work, and
                finish only the phase's declared objective.
      - runPhaseAfterSequence: true

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "Priority 4 workflow already completed at {{ state.workflow_complete.value }}"
        - stop: success

    - id: recover-interrupted-phase
      if: "{{ state.active_phase.exists }}"
      recover: activePhase

    - id: require-clean-after-recovery
      assert:
        type: implementation-workspace-clean

    - id: starting-state
      validate: starting-state

    - phase: "01"
    - phase: "02"
    - phase: "03"
    - phase: "04"
    - phase: "05"
    - phase: "06"
    - phase: "07"

    - id: post-audit-priority4-acceptance
      validate: priority4-acceptance

    - id: post-audit-checkpoint
      checkpoint: checkpoint
      label: priority4-post-audit

    - human: priority-4-authoring-review

    - complete: priority-4

  humanGates:
    - id: priority-4-authoring-review
      idempotent_record: "{{ state.manual_confirmation }}"
      requires:
        - "07"
      when: "{{ parameters.require_authoring_review }}"
      instructions: >-
        Review Priority 4 from the final checkout. Inspect both concise benchmark
        workflows and their `agentflow plan --expanded` output, then review the
        retained concision evidence before accepting the terminal transition.
      checklist:
        - id: concise-self-host
          text: >-
            develop-agentflow is materially smaller outside prompts and reads
            primarily as task policy rather than AgentFlow lifecycle plumbing.
        - id: concise-priority5
          text: >-
            finish-priority-05 is materially smaller outside prompts while
            preserving mutation, validation, repair, recovery, human-gate, and
            completion guarantees.
        - id: recovery-owned-by-runtime
          text: >-
            Normal safe resume in the benchmark workflows no longer requires an
            explicit procedural recovery sequence.
        - id: deterministic-progress-bookkeeping
          text: >-
            Criterion actors no longer mark their own acceptance state and
            deterministic bookkeeping replaces bookkeeping-only model work.
        - id: validation-evidence-reuse
          text: >-
            Tests/evidence demonstrate same-state deterministic validation reuse
            and rerun after a declared relevant dependency changes.
        - id: expanded-plan-reviewable
          text: >-
            `agentflow plan --expanded` exposes generated lifecycle, recovery,
            safety, validation/repair, progress, checkpoint, human, and completion
            behavior for both benchmark workflows.
        - id: authority-separated
          text: >-
            Actor authority, workspace mutation authority, and deterministic
            validation authority remain structurally distinct in authored and
            expanded forms.
        - id: evidence-credible
          text: >-
            docs/evidence/priority-4-concision.md reports a reproducible
            before/after method and actual measurements without hiding prompt text
            or dropped safety semantics.
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        record: "{{ state.manual_confirmation }}"
        value: head_commit
      skip:
        allowed_when: "{{ not parameters.require_authoring_review }}"
        warning: "Priority 4 authoring review was skipped"
        evidence:
          record: "{{ state.manual_confirmation }}"
          value: "skipped {{ head_commit }}"

  completion:
    priority-4:
      assertions:
        - uses: assert-change-scope

        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity

        - uses: assert-regex
          with:
            path: "{{ spec.paths.priority4_evidence }}"
            regex: '^# Priority 4 concision evidence[[:space:]]*$'

      finalValidation: priority4-acceptance

      checkpoint:
        uses: checkpoint
        label: priority-4-complete

      afterCheckpointAssertions:
        - uses: assert-change-scope
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean

      writeMarker:
        record: "{{ state.workflow_complete }}"
        value: head_commit

      summary:
        title: "Priority 4 — Runtime-owned orchestration and concise SDL authoring — complete."
        include:
          - branch
          - base_commit
          - head_commit
          - state_directory
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
