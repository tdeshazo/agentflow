apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: develop-agentflow
  description: >-
    Repository-owned workflow for one bounded AgentFlow development task. It
    enforces the repository boundary, deterministic quality gate, durable Git
    checkpoints, recovery, independent audit, and human acceptance without a
    coordinating shell wrapper.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    task:
      type: string
      # An empty task lets `status` inspect an unstarted workflow. `run` needs
      # an explicit, bounded task and the implementation phase refuses to make
      # a speculative change when this value is empty.
      default: ""
    luna_model:
      type: string
      default: "{{ env.LUNA_MODEL | default('gpt-5.6-luna') }}"
    terra_model:
      type: string
      default: "{{ env.TERRA_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    canonical_gate: scripts/check.sh
    ci_policy: .github/workflows/quality.yml
    self_host_workflow: examples/develop-agentflow.agent-workflow.yaml

  state:
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
    cleanliness:
      before_first_run: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      # Ordinary AgentFlow implementation, specification, test, and guide
      # paths are mutable. Sensitive project governance remains outside this
      # allowlist and is checked again by integrity rules below.
      allowed:
        - cmd/**
        - internal/**
        - provider/**
        - spec/**
        - docs/**
        - README.md
        - CHANGELOG.md
        - CONTRIBUTING.md
        - go.mod
        - go.sum
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: roadmap
          paths: [ROADMAP.md]
          mode: exact-hash
        - id: research-documents
          paths: [docs/research/**]
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths: [scripts/check.sh]
          mode: exact-hash
        - id: self-host-workflow
          paths: [examples/develop-agentflow.agent-workflow.yaml]
          mode: exact-hash
        - id: ci-validation-policy
          paths: [.github/workflows/quality.yml]
          mode: exact-hash

  defaults:
    agent:
      runner: codex
      sandbox: workspace-write
      approval: never
      ephemeral: true
      may_commit: true
      output_last_message: true
    lifecycle:
      policy: safe-resume
      validation: gate
    phases:
      implementation:
        actor: luna
        reasoning: high
        requiresChange: true
        validation: implementation-gate
      audit:
        actor: terra
        reasoning: high
        requiresChange: false
    repair:
      actor: terra
      reasoning: high
      prompt: |
        The deterministic AgentFlow quality gate failed while implementing the
        bounded task below:

        {{ parameters.task }}

        Inspect the actual checkout and repair only the failure necessary for
        this task. Preserve the declared workspace scope and protected
        resources. Do not weaken validation or broaden the task.

        --- gate output ---
        {{ tail(validation.failure.log, 260) }}

  agents:
    luna:
      model: "{{ parameters.luna_model }}"
    terra:
      model: "{{ parameters.terra_model }}"

  tools:
    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg]
    - id: required-files
      type: files-exist
      paths:
        - ROADMAP.md
        - docs/research/agent-workflow-orchestration-landscape.md
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.ci_policy }}"
        - "{{ spec.paths.self_host_workflow }}"
    - id: ci-delegates-to-canonical-gate
      type: file-contains
      path: "{{ spec.paths.ci_policy }}"
      text: scripts/check.sh

  validation:
    gate:
      steps:
        - uses: canonical-gate
    starting-state:
      steps:
        - uses: canonical-gate
    implementation-gate:
      steps:
        - uses: canonical-gate
      repair: once
    audit-gate:
      steps:
        - uses: canonical-gate
    final-gate:
      steps:
        - uses: canonical-gate

  phases:
    - id: implement
      kind: implementation
      label: bounded-agentflow-implementation
      prompt: |
        Work on exactly this bounded AgentFlow development task:

        {{ parameters.task }}

        First inspect the current repository, ROADMAP.md Priority 3 context,
        and the relevant implementation/specification/tests. Implement only the
        requested change and focused deterministic regression coverage. Keep
        changes within the workflow allowlist. Do not modify protected files or
        broaden the task. Run relevant checks before returning.

        If the task is empty, make no changes and report that the caller must
        supply --set task='...'.
    - id: audit
      kind: audit
      label: independent-agentflow-audit
      validation: audit-gate
      prompt: |
        Independently audit the repository state for this bounded task:

        {{ parameters.task }}

        Do not accept an implementation completion claim as evidence. Inspect
        the actual current checkout: read the changed files, compare the saved
        base commit through HEAD, inspect relevant tests/specification, and run
        focused checks as needed. Verify the task is complete, behavior is
        covered, and no unrelated or protected resource was changed. Repair a
        genuine in-scope defect if needed; otherwise leave the checkout alone.
        Do not add features beyond the stated task or weaken validation.
  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "Self-hosting workflow already completed at {{ state.workflow_complete.value }}"
        - stop: success
    # A self-development run must be bounded before it is allowed to call an
    # implementation provider. This is workflow authority, not a prompt-only
    # instruction to the actor.
    - id: require-bounded-task
      if: "{{ parameters.task == '' }}"
      then:
        - stop: "task parameter is required; pass --set task='<bounded AgentFlow change>'"
    - id: starting-state
      validate: starting-state
    - phase: implement
    - phase: audit
    - id: post-audit
      validate: audit-gate
    - human: self-host-review
    - complete: self-hosted-development

  humanGates:
    - id: self-host-review
      requires: [audit]
      after:
        - validation: post-audit
      instructions: >-
        Review the bounded development task in the actual repository checkout,
        including the changed files, Git history, and successful canonical
        check output. Confirm that the task is complete, is in scope, and does
        not weaken protected repository policy.
      checklist:
        - id: task-complete
          text: "The requested bounded task is complete in the repository state."
        - id: scope-respected
          text: "Only allowed paths changed and protected resources are unchanged."
        - id: gate-reviewed
          text: "scripts/check.sh passed against the final audited checkout."
      acknowledgement:
        type: exact-text
        value: "yes"
      evidence:
        value: head_commit

  completion:
    self-hosted-development:
      assertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      afterCheckpointAssertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        value: head_commit
      summary:
        title: "AgentFlow self-development task complete."
        include:
          - branch
          - base_commit
          - head_commit
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
