apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: harden-agentflow-spec-skill
  description: >-
    Black-box hardening workflow for the bundled agentflow-spec skill. It asks
    independent agents to author representative AgentWorkflow specifications
    using only the skill bundle, uses deterministic validation to catch
    regressions, and permits fixes only inside the skill package.

spec:
  parameters:
    repo_root:
      type: path
      default: "."
    author_model:
      type: string
      default: "{{ env.SKILL_AUTHOR_MODEL | default('gpt-5.6-luna') }}"
    reviewer_model:
      type: string
      default: "{{ env.SKILL_REVIEWER_MODEL | default('gpt-5.6-terra') }}"
    reset_workflow_state:
      type: boolean
      default: false
      env: RESET_WORKFLOW_STATE

  paths:
    skill_root: skills/agentflow-spec
    skill_entry: skills/agentflow-spec/SKILL.md
    authoring_reference: skills/agentflow-spec/references/authoring-agentflow-v1alpha1.md
    field_reference: skills/agentflow-spec/references/agentflow-v1alpha1.md
    validator: skills/agentflow-spec/scripts/validate_workflow.py
    canonical_gate: scripts/check.sh
    self_workflow: examples/harden-agentflow-spec-skill.agent-workflow.yaml
    eval_scratch: skills/agentflow-spec/.eval-work

  state:
    reset:
      when: "{{ parameters.reset_workflow_state }}"
      require_clean_implementation_workspace: true
      delete_state_directory: true

  workspace:
    root: "{{ parameters.repo_root }}"
    vcs: git
    localControlFiles:
      ignoredForDirtyState:
        - "{{ workflow.file | default('') }}"
    cleanliness:
      before_first_run: required
      outside_recoverable_active_phase: required
      after_checkpoint: required
    mutationPolicy:
      allowed:
        - skills/agentflow-spec/**
      lineage:
        require_base_is_ancestor_of_head: true
        require_same_branch_as_state: true
      integrity:
        - id: implementation-source
          paths:
            - cmd/**
            - internal/**
            - provider/**
            - main.go
          mode: group-exact-hash
        - id: external-contract-surfaces
          paths:
            - spec/**
            - docs/reference/**
          mode: group-exact-hash
        - id: shipped-examples
          paths:
            - examples/**
          mode: group-exact-hash
        - id: canonical-quality-gate
          paths:
            - scripts/check.sh
          mode: exact-hash
        - id: ci-policy
          paths:
            - .github/workflows/quality.yml
          mode: exact-hash

  defaults:
    agent:
      runner: codex
      sandbox: workspace-write
      approval: never
      ephemeral: true
      color: never
      may_commit: true
      output_last_message: true
    lifecycle:
      policy: safe-resume
    phases:
      audit:
        actor: skill-author
        reasoning: high
        requiresChange: false
    repair:
      actor: skill-reviewer
      reasoning: high
      prompt: |
        A deterministic gate failed while hardening the agentflow-spec skill.

        Repair the smallest root cause inside skills/agentflow-spec/**. Do not
        inspect AgentFlow implementation source, tests, spec/**, docs/reference/**,
        or examples/** to discover behavior. You may execute the bundled skill
        validator and the repository quality gate as black boxes. Preserve the
        rule that the skill bundle itself must be sufficient for authoring.

        --- gate output ---
        {{ tail(validation.failure.log, 260) }}

  agents:
    skill-author:
      model: "{{ parameters.author_model }}"
    skill-reviewer:
      model: "{{ parameters.reviewer_model }}"

  tools:
    canonical-gate:
      type: shell
      command: "./{{ spec.paths.canonical_gate }}"
    skill-hygiene:
      type: shell
      command: >-
        test -f "{{ spec.paths.skill_entry }}" &&
        test -f "{{ spec.paths.authoring_reference }}" &&
        test -f "{{ spec.paths.field_reference }}" &&
        test -f "{{ spec.paths.validator }}" &&
        test ! -e "{{ spec.paths.eval_scratch }}"
    skill-validator-smoke:
      type: shell
      command: >-
        python3 "{{ spec.paths.validator }}" --expanded-plan
        "{{ spec.paths.self_workflow }}"

  preconditions:
    - id: repository-root
      type: git-repository
      path: "{{ parameters.repo_root }}"
    - id: required-commands
      type: commands-exist
      commands: [git, codex, sh, bash, go, gofmt, rg, python3]
    - id: required-files
      type: files-exist
      paths:
        - "{{ spec.paths.skill_entry }}"
        - "{{ spec.paths.authoring_reference }}"
        - "{{ spec.paths.field_reference }}"
        - "{{ spec.paths.validator }}"
        - "{{ spec.paths.canonical_gate }}"
        - "{{ spec.paths.self_workflow }}"

  validation:
    starting-state:
      steps:
        - uses: skill-hygiene
        - uses: canonical-gate
    authoring-gate:
      repair: once
      steps:
        - uses: skill-hygiene
        - uses: skill-validator-smoke
        - uses: canonical-gate
    red-team-gate:
      repair: once
      steps:
        - uses: skill-hygiene
        - uses: skill-validator-smoke
        - uses: canonical-gate
    final-gate:
      steps:
        - uses: skill-hygiene
        - uses: skill-validator-smoke
        - uses: canonical-gate

  phases:
    - id: exercise-and-improve
      kind: audit
      label: black-box-authoring-suite
      actor: skill-author
      reasoning: high
      requiresChange: false
      validation: authoring-gate
      prompt: |
        Harden the agentflow-spec skill as a black-box authoring contract.

        For AgentFlow authoring knowledge, read only:
        - {{ spec.paths.skill_entry }}
        - files linked from that skill under {{ spec.paths.skill_root }}/references/
        - {{ spec.paths.validator }} for how to invoke validation

        Do not inspect internal/**, provider/**, cmd/**, Go source, tests,
        spec/**, docs/reference/**, or examples/** to learn workflow fields or
        runtime semantics. Executing the bundled validator or canonical gate is
        allowed; reading their implementation dependencies is not.

        Create {{ spec.paths.eval_scratch }} as temporary scratch space and,
        from the skill alone, independently author complete workflows for all of
        these challenge briefs:

        1. A minimal bounded implementation with unknown repository facts that
           must be parameterized instead of invented.
        2. Implementation plus independent audit, protected governance content,
           a deterministic gate, and exactly one bounded repair attempt.
        3. A three-criterion markdown checklist workflow where the engine owns
           criterion advancement and a bounded loop selects the next criterion.
        4. A workflow with a human gate only for evidence automation cannot
           establish, with durable acknowledgement evidence.
        5. A workflow with explicit checkpointing and durable completion ordered
           so assertions and final validation precede the completion marker.
        6. A resumable repository-maintenance workflow with concise defaults,
           stable IDs, clean-state rules, and no agent-controlled acceptance.

        Do not copy shipped examples. For every probe, run the bundled validator
        with --expanded-plan. Inspect only the validator diagnostics and expanded
        plan. If a probe fails because the skill is incomplete, ambiguous, or
        misleading, improve SKILL.md and/or its bundled references, regenerate
        the affected probe from the improved skill, and validate again. Prefer
        concise clarifications and reusable patterns over case-specific prose.

        Before returning:
        - every probe must validate and produce an expanded plan;
        - the skill must remain self-contained and must not depend on source
          inspection;
        - delete {{ spec.paths.eval_scratch }};
        - leave no generated probe files or evaluation debris in the repository.
        If the skill already passes all probes, make no cosmetic change merely
        to create a diff.

    - id: independent-red-team
      kind: audit
      label: independent-skill-red-team
      actor: skill-reviewer
      reasoning: high
      requiresChange: false
      validation: red-team-gate
      prompt: |
        Independently red-team the current agentflow-spec skill after the first
        authoring pass.

        Use only the skill bundle under {{ spec.paths.skill_root }} as AgentFlow
        authoring knowledge. Do not read implementation source, tests, spec/**,
        docs/reference/**, or examples/**. You may execute the bundled validator
        and canonical gate as black boxes.

        In temporary {{ spec.paths.eval_scratch }}, author at least three fresh
        workflows from requirements that stress the most failure-prone contract
        boundaries: mutation authority versus agent capability, deterministic
        validation and bounded repair, progress ownership, human evidence, and
        completion/checkpoint ordering. Include at least one deliberately
        underspecified repository task and verify the skill causes you to
        parameterize unknown facts rather than fabricate them.

        Validate every fresh workflow with --expanded-plan. Audit any skill
        changes since the saved base for accuracy, internal consistency,
        concision, and public-contract-only reasoning. If you find a genuine
        skill defect, fix it inside skills/agentflow-spec/** and rerun the
        relevant probes. Do not weaken the validator or repository gate.

        Delete {{ spec.paths.eval_scratch }} before returning. If the skill is
        already sufficient, leave it unchanged.

  flow:
    - id: already-complete
      if: "{{ state.workflow_complete.exists }}"
      then:
        - report: "Skill hardening workflow already completed at {{ state.workflow_complete.value }}"
        - stop: success
    - id: starting-state
      validate: starting-state
    - phase: exercise-and-improve
    - phase: independent-red-team
    - complete: hardened-skill

  completion:
    hardened-skill:
      assertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
      finalValidation: final-gate
      afterCheckpointAssertions:
        - type: workspace-integrity
          policy: spec.workspace.mutationPolicy.integrity
        - type: implementation-workspace-clean
      writeMarker:
        value: head_commit
      summary:
        title: "AgentFlow specification skill hardening complete."
        include:
          - branch
          - base_commit
          - head_commit
          - commits_since_base
          - changed_files_since_base
          - workspace_clean
          - canonical_gate_green
