apiVersion: agentflow.dev/v1alpha2
kind: AgentWorkflow
metadata:
  name: unsupported-v1alpha2-approval-policy
spec:
  workspace:
    allowWrites: [src/**]
  agents:
    coder:
      runner: codex
      model: gpt-5.6-terra
      approval: on-request
  validation:
    tests:
      run: make test
  phases:
    - id: implement
      actor: coder
      prompt: Implement the feature.
      validation: tests
  completion:
    validation: tests
