apiVersion: agentflow.dev/v1alpha1
kind: AgentWorkflow
metadata:
  name: conformance-unsupported-runtime
spec:
  agents:
    worker:
      runner: remote-agent
  tools:
    gate:
      type: file-regex
  validation:
    gate:
      steps:
        - uses: gate
  phases:
    - id: build
      kind: implementation
      actor: worker
      validation: gate
  flow:
    - phase: build
