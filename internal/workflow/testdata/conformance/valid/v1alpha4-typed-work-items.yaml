apiVersion: agentflow.dev/v1alpha4
kind: AgentWorkflow
metadata: {name: typed-work-items}
spec:
  workspace:
    allowWrites: [src/**, progress.md]
  agents:
    implementer: {runner: codex, model: gpt-5.6-terra}
  validation:
    quality: {run: test -f src/result.txt}
  criteria:
    items:
      - {id: add-api, description: Add the API capability.}
      - {id: add-tests, description: Add the regression tests.}
    markdownChecklist:
      path: progress.md
      items:
        add-api: Add the API capability.
        add-tests: Add the regression tests.
  phases:
    - id: implement-items
      kind: implementation
      actor: implementer
      prompt: Complete only the assigned work item.
      validation: quality
      advanceWorkItem: true
      forEach:
        workItems: [add-api, add-tests]
        maxItems: 2
  completion: {validation: quality}
