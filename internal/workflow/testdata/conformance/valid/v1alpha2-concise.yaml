apiVersion: agentflow.dev/v1alpha2
kind: AgentWorkflow

metadata:
  name: feature

spec:
  workspace:
    allowWrites: [src/**, tests/**]

  agents:
    coder:
      runner: codex
      model: gpt-5.6-terra
      sandbox: workspace-write
      approval: never
      ephemeral: true
      may_commit: true
      output_last_message: true

  validation:
    tests:
      run: make test
      repair:
        once: coder

  phases:
    - id: implement
      actor: coder
      prompt: Implement the feature.
      validation: tests

    - id: review
      actor:
        runner: codex
        model: gpt-5.6-luna
        sandbox: workspace-write
        approval: never
        ephemeral: true
        may_commit: false
        output_last_message: true
      dependsOn: [implement]
      prompt: Review the feature.
      validation: tests

  completion:
    validation: tests
